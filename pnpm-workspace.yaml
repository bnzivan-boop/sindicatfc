packages:
  - apps/*
  - packages/*

# Expo / React Native требуют плоского node_modules
nodeLinker: hoisted
strictPeerDependencies: false

# pnpm ≥10 блокирует postinstall-скрипты; разрешаем только проверенные
allowBuilds:
  esbuild: true
  prisma: true
  '@prisma/engines': true
  '@prisma/client': true
  '@nestjs/core': true
  sharp: true
  unrs-resolver: true
  '@scarf/scarf': false # телеметрия — не запускаем

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.26'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo@57.0.24
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19'
  - expo-location@57.0.19
  - expo-notifications@57.0.20
  - expo-router@57.0.22
